<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Fav Icon -->
    <link rel="icon" type="image/x-icon" href="images/Pokeball.png">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Animate.css -->
    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

    <title>Pokédex - Sign in</title>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="dashboard-style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body id="login">
    <main id="sign-in">
        <div id="form-background">
            <!-- Sign in Form -->
            <!-- form action is where the form will send the user info to when inputted 
                    form method is how the form will be sent; post or get
                        post is secure and is sent invisibly 
                        get is not secure and is sent through the URL/browser -->
            <form action="" method="" id="login-form">
                <div id="signIn">
                    <h1>Sign in</h1>

                    <!-- Error message -->
                    <p id="loginError" class="error"></p>
        
                    <div class="input-fields">
                        <!-- Input box for username -->
                        <input type="text" name="userName" id="userName" class="name-field" placeholder="username">
        
                        <!-- Input box for user password -->
                        <input type="password" name="userPassword" id="userPassword" placeholder="password">
                    </div>
        
                    <!-- Forgot password link -->
                    <a id="forgot-password" href="#">Forgot password?</a>
        
                    <!-- Form submit button -->
                    <button type="submit" name="loginBtn" id="loginBtn">Login</button>
        
                    <!-- Additional Links -->
                    <p id="new-account">Don't have an account? <a id="sign-up" href="#">Sign up</a></p>
                </div>

                <div id="signUp">
                    <h1>Create Account</h1>

                    <!-- Error message -->
                    <p id="signUpError" class="error"></p>

                    <div class="input-fields">
                        <!-- user name -->
                        <input type="text" name="signUpName" id="signUpName" class="name-field" placeholder="username">

                        <!-- email -->
                        <input type="email" name="signUpEmail" id="signUpEmail" class="email-field" placeholder="email">

                        <!-- Input box for user password -->
                        <input type="password" name="signUpPassword" id="signUpPassword" placeholder="password">

                        <!-- user confirm password -->
                        <input type="password" name="confirmPassword" id="confirmPassword" placeholder="confirm password">
                    </div>

                    <!-- Forgot password link -->
                    <p class="existing-account">Already have an account? <a class="existing-account-login" href="index.html">Login</a></p>

                    <p class="policy">By creating an account you agree to our <br> <a class="policy-link" href="https://en.wikipedia.org/wiki/Terms_of_service" target="_blank">Terms & Privacy</a></p>

                    <!-- Form submit button -->
                    <button type="submit" name="newUser" id="newUser">Sign up</button>
                </div>
            </form>
        </div>
    </main>
</body>
<script src="script.js"></script>
</html>
