<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fav Icon -->
    <link rel="icon" type="image/x-icon" href="images/Pokeball.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Flowbite -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />

    <title>PokéHub - Sign in</title>
</head>
<body class="bg-[url(images/pikachu-sign-in-2.jpg)] bg-cover bg-center bg-no-repeat text-white min-h-screen">
    <main id="sign-in" class="">
        <div id="form-background" class="w-full flex flex-col justify-center items-center px-5 bg-gray-900/90 min-w-full min-h-screen">
            <h1 class="text-4xl font-bold text-center text-yellow-400">Welcome to PokéHub!</h1>

            <p class="text-center">Become a Pokémon master</p>

            <form id="login-form" class="flex mx-auto md:w-1/4 flex-col">
                <!-- Sign In Form -->
                <div id="signIn" class="space-y-3">
                    <p id="loginError" class="text-red-500 text-center font-semibold"></p>
                    <div>
                        <label for="userName" class="block mb-2 text-sm font-medium text-gray-300">Username</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 start-0 flex items-center ps-3.5 pointer-events-none">
                                <svg class="w-4 h-4 text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20"><path d="M10 0a10 10 0 1 0 10 10A10.011 10.011 0 0 0 10 0Zm0 5a3 3 0 1 1 0 6 3 3 0 0 1 0-6Zm0 13a8.949 8.949 0 0 1-4.951-1.488A3.987 3.987 0 0 1 9.05 13.5h1.9a3.987 3.987 0 0 1 3.999 4.012A8.949 8.949 0 0 1 10 18Z"/></svg>
                            </div>
                            <input type="text" name="userName" id="userName" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-yellow-500 focus:border-yellow-500 block w-full ps-10 p-2.5" placeholder="username">
                        </div>
                    </div>
                    <div>
                        <label for="userPassword" class="block mb-2 text-sm font-medium text-gray-300">Password</label>
                        <div class="relative">
                                <div class="absolute inset-y-0 start-0 flex items-center ps-3.5 pointer-events-none">
                                <svg class="w-4 h-4 text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 20"><path d="M14 7h-1.5V4.5a4.5 4.5 0 1 0-9 0V7H2a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2Zm-5 8a1 1 0 1 1-2 0v-3a1 1 0 1 1 2 0v3Zm1.5-8h-5V4.5a2.5 2.5 0 1 1 5 0V7Z"/></svg>
                            </div>
                            <input type="password" name="userPassword" id="userPassword" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-yellow-500 focus:border-yellow-500 block w-full ps-10 p-2.5" placeholder="••••••••">
                        </div>
                    </div>
                    <div class="flex items-center justify-between">
                        <a id="forgot-password" href="#" class="text-sm text-yellow-500 hover:underline">Forgot password?</a>
                    </div>
                    <button type="submit" name="loginBtn" id="loginBtn" class="w-full text-white bg-red-600 hover:bg-red-800 focus:ring-4 focus:outline-none focus:ring-red-500 font-medium rounded-lg text-sm px-5 py-2.5 text-center">Login</button>
                    <p id="new-account" class="text-sm font-light text-gray-400">
                        Don't have an account? <a id="sign-up" href="#" class="font-medium text-yellow-500 hover:underline">Sign up</a>
                    </p>
                </div>
                <!-- Sign Up Form -->
                <div id="signUp" class="hidden space-y-3">
                    <p id="signUpError" class="text-red-500 text-center font-semibold"></p>
                    <div>
                        <label for="signUpName" class="block mb-2 text-sm font-medium text-gray-300">Username</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 start-0 flex items-center ps-3.5 pointer-events-none">
                                <svg class="w-4 h-4 text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20"><path d="M10 0a10 10 0 1 0 10 10A10.011 10.011 0 0 0 10 0Zm0 5a3 3 0 1 1 0 6 3 3 0 0 1 0-6Zm0 13a8.949 8.949 0 0 1-4.951-1.488A3.987 3.987 0 0 1 9.05 13.5h1.9a3.987 3.987 0 0 1 3.999 4.012A8.949 8.949 0 0 1 10 18Z"/></svg>
                            </div>
                            <input type="text" name="signUpName" id="signUpName" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-yellow-500 focus:border-yellow-500 block w-full ps-10 p-2.5" placeholder="username">
                        </div>
                    </div>
                    <div>
                        <label for="signUpEmail" class="block mb-2 text-sm font-medium text-gray-300">Email</label>
                            <div class="relative">
                            <div class="absolute inset-y-0 start-0 flex items-center ps-3.5 pointer-events-none">
                                <svg class="w-4 h-4 text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 16"><path d="m10.036 8.278 9.258-7.79A1.979 1.979 0 0 0 18 0H2A1.987 1.987 0 0 0 .641.541l9.395 7.737Z"/><path d="M11.241 9.817c-.36.275-.801.425-1.255.427-.428 0-.845-.138-1.187-.395L0 2.6V14a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V2.5l-8.759 7.317Z"/></svg>
                            </div>
                            <input type="email" name="signUpEmail" id="signUpEmail" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-yellow-500 focus:border-yellow-500 block w-full ps-10 p-2.5" placeholder="name@company.com">
                        </div>
                    </div>
                    <div>
                        <label for="signUpPassword" class="block mb-2 text-sm font-medium text-gray-300">Password</label>
                        <div class="relative">
                                <div class="absolute inset-y-0 start-0 flex items-center ps-3.5 pointer-events-none">
                                <svg class="w-4 h-4 text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 20"><path d="M14 7h-1.5V4.5a4.5 4.5 0 1 0-9 0V7H2a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2Zm-5 8a1 1 0 1 1-2 0v-3a1 1 0 1 1 2 0v3Zm1.5-8h-5V4.5a2.5 2.5 0 1 1 5 0V7Z"/></svg>
                            </div>
                            <input type="password" name="signUpPassword" id="signUpPassword" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-yellow-500 focus:border-yellow-500 block w-full ps-10 p-2.5" placeholder="••••••••">
                        </div>
                    </div>
                    <div>
                        <label for="confirmPassword" class="block mb-2 text-sm font-medium text-gray-300">Confirm password</label>
                        <div class="relative">
                                <div class="absolute inset-y-0 start-0 flex items-center ps-3.5 pointer-events-none">
                                <svg class="w-4 h-4 text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 20"><path d="M14 7h-1.5V4.5a4.5 4.5 0 1 0-9 0V7H2a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2Zm-5 8a1 1 0 1 1-2 0v-3a1 1 0 1 1 2 0v3Zm1.5-8h-5V4.5a2.5 2.5 0 1 1 5 0V7Z"/></svg>
                            </div>
                            <input type="password" name="confirmPassword" id="confirmPassword" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-yellow-500 focus:border-yellow-500 block w-full ps-10 p-2.5" placeholder="••••••••">
                        </div>
                    </div>
                    <p class="text-sm text-center text-gray-400">By creating an account you agree to our <br> <a class="font-medium text-yellow-500 hover:underline" href="https://en.wikipedia.org/wiki/Terms_of_service" target="_blank">Terms & Privacy</a></p>
                    <button type="submit" name="newUser" id="newUser" class="w-full text-white bg-red-600 hover:bg-red-800 focus:ring-4 focus:outline-none focus:ring-red-500 font-medium rounded-lg text-sm px-5 py-2.5 text-center">Sign up</button>
                    <p class="text-sm font-light text-gray-400">
                        Already have an account? <a href="index.html" class="existing-account-login font-medium text-yellow-500 hover:underline">Login</a>
                    </p>
                </div>
            </form>
        </div>
    </main>
    <!-- Flowbite -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
    
    <!-- Custom JS -->
    <script src="scripts/script.js"></script>
</body> 
</html>
