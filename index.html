<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles/sign-in-style.css">

    <!-- Fav Icon -->
    <link rel="icon" type="image/x-icon" href="../images/Pokeball.png">

    <title>Pokedex Sign in</title>
</head>
<body>
    <main id="sign-in">
        <div id="form-background">
            <!-- Sign in Form -->
             <!-- form action is where the form will send the user info to when inputted 
                    form method is how the form will be sent; post or get
                        post is secure and is sent invisibly 
                        get is not secure and is sent through the URL/browser -->
            <form action="php/register.php" method="POST" id="login-form">
                <h1>Sign in</h1>
    
                <div id="input-fields">
                    <!-- Input box for username -->
                    <input type="text" name="userName" id="userName" placeholder="username" required>
    
                    <!-- Input box for user password -->
                    <input type="password" name="userPassword" id="userPassword" placeholder="password" required>
                </div>
    
                <!-- Forgot password link -->
                <a id="forgot-password" href="#">Forgot password?</a>
    
                <!-- Form submit button -->
                <button type="submit" name="login-btn">Login</button>
    
                <!-- Additional Links -->
                <p id="new-account">Don't have an account? <a id="sign-up" href="#">Sign up</a></p>
            </form>
        </div>
    </main>
</body>
<script src="scripts/signup.js"></script>
</html>
