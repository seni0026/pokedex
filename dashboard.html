<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fav Icon -->
    <link rel="icon" type="image/x-icon" href="images/Pokeball.png">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Animate.css -->
      <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

    <title>Pokédex - Dashboard</title>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="dashboard-style.css">
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <header id="dashboard">
        <div class="wrapper">
            <!-- Nav Bar start -->
            <nav class="navbar">
                <div class="navbar-container">
                    <span class="toggler-icon">
                        <i class="fa-solid fa-circle-user"></i>
                        <span class="user-name"></span>
                    </span>
                    <div class="open" id="navbarNav">
                        <ul id="nav-links">
                            <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                            <li class="nav-item"><a class="nav-link" href="pokeland.html">Enter Pokéland</a></li>
                            <li class="nav-item"><a class="nav-link" href="#">Manage Account</a></li>
                            <li class="nav-item"><a class="nav-link" href="index.html">Log out <span><i class="fa-solid fa-right-from-bracket"></i></span></a></li>
                        </ul>
                    </div>
                </div>
            </nav>
            <!-- Nav Bar end --> 

            <!-- Welcome Section -->
            <section>
                <div class="container" id="welcome-section">
                    <h1>Welcome, <span class="pokedex-user"></span> to your Pokédex Dashboard!</h1>

                    <h3><span id="pokeCount">0</span> Pokémon in Pokéland</h3>
                    <a id="pokeland-link" href="pokeland.html">Enter Pokéland</a>
                </div>
            </section>
        </div>
    </header>
    <main>
        <!-- Gotta Catch 'Em All Section -->
        <section id="pokemon-section">
            <div id="main-banner">
                <div id="banner-pokemon"></div>
                <h2>Gotta Catch 'Em All</h2>
            </div>

            <!-- Pokemon Display -->
            <div id="pokemon-display" class=""></div>
            <button id="more-pokemon" class="load-pokemon-btn" >more Pokémon...</button>
        </section>
    </main>
</body>
<script src="script.js"></script>
</html>
