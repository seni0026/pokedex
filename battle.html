<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fav Icon -->
    <link rel="icon" type="image/x-icon" href="images/Pokeball.png">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Flowbite -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />

    <title>Pokédex - Battle Arena</title>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <header class="bg-gray-900/80 pt-5">
        <!-- Navbar -->
        <nav class="flex justify-between items-center px-8 py-4">
            <h1 class="text-2xl font-bold text-yellow-400">Battle Arena</h1>
            <button id="dropdownUserAvatarButton" data-dropdown-toggle="dropdownAvatar" class="flex text-sm bg-gray-800 rounded-full md:me-0 focus:ring-4 focus:ring-gray-600" type="button">
                <span class="sr-only">Open user menu</span>
                <div class="relative w-10 h-10">
                    <i class="fa-solid fa-circle-user text-4xl text-red-600"></i>
                </div>
            </button>

            <!-- Dropdown menu -->
            <div id="dropdownAvatar" class="z-10 hidden bg-gray-700 divide-y divide-gray-600 rounded-lg shadow w-44">
                <div class="px-4 py-3 text-sm text-white">
                    <div class="font-medium pokedex-user capitalize">User</div>
                </div>
                <ul class="py-2 text-sm text-gray-200" aria-labelledby="dropdownUserAvatarButton">
                    <li>
                        <a href="dashboard.html" class="block px-4 py-2 hover:bg-gray-600 hover:text-white">Dashboard</a>
                    </li>
                    <li>
                        <a href="pokeland.html" class="block px-4 py-2 hover:bg-gray-600 hover:text-white">Pokéland</a>
                    </li>
                </ul>
                <div class="py-2">
                    <a href="index.html" class="block px-4 py-2 text-sm text-gray-200 hover:bg-gray-600 hover:text-white">
                        Sign out <i class="fa-solid fa-right-from-bracket ml-2"></i>
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <main class="bg-[url('images/battle-arena.png')] bg-cover bg-center">
        <div class="bg-black/30 min-h-screen flex flex-col justify-between p-4">
            <!-- Battle Arena -->
            <div id="battle-arena" class="flex flex-col justify-between h-full">
                <!-- Opponent Side -->
                <div id="opponent-side" class="flex justify-end items-start">
                    <div class="flex flex-col items-center">
                        <!-- Opponent Status -->
                        <div class="bg-gray-800/80 p-2 rounded-lg border-2 border-gray-600 w-64 mb-2">
                            <div class="flex justify-between items-center">
                                <h3 id="opponent-name" class="font-bold capitalize text-lg">Opponent</h3>
                                <p id="opponent-level" class="text-sm">Lv. 50</p>
                            </div>
                            <div class="w-full bg-gray-600 rounded-full h-2.5 mt-1">
                                <div id="opponent-hp" class="bg-green-500 h-2.5 rounded-full" style="width: 50%"></div>
                            </div>
                        </div>
                        <!-- Opponent Sprite -->
                        <div id="opponent-sprite" class="h-40 w-40 flex items-center justify-center">
                            <!-- JS will add opponent's Pokémon image here -->
                        </div>
                    </div>
                </div>

                <!-- Player Side -->
                <div id="player-side" class="flex justify-start items-end">
                    <div class="flex flex-col items-center">
                        <!-- Player Sprite -->
                        <div id="player-sprite" class="h-40 w-40 flex items-center justify-center">
                            <!-- JS will add player's Pokémon image here -->
                        </div>
                        <!-- Player Status -->
                        <div class="bg-gray-800/80 p-2 rounded-lg border-2 border-gray-600 w-64 mt-2">
                            <div class="flex justify-between items-center">
                                <h3 id="player-name" class="font-bold capitalize text-lg">Player</h3>
                                <p id="player-level" class="text-sm">Lv. 50</p>
                            </div>
                            <div class="w-full bg-gray-600 rounded-full h-2.5 mt-1">
                                <div id="player-hp" class="bg-green-500 h-2.5 rounded-full" style="width: 100%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Battle Controls & Message Log -->
            <div id="battle-controls" class="bg-gray-800/90 border-t-4 border-yellow-400 p-4 rounded-t-lg mt-4 grid grid-cols-2 gap-4">
                <div id="message-log" class="col-span-2 md:col-span-1 border-2 border-gray-600 rounded-lg p-4 h-24 overflow-y-auto">
                    <p>A wild Pokémon appears!</p>
                </div>
                <div id="action-buttons" class="col-span-2 md:col-span-1 grid grid-cols-2 gap-4">
                    <button class="bg-red-600 hover:bg-red-700 p-4 rounded-lg font-bold text-lg">Fight</button>
                    <button class="bg-blue-600 hover:bg-blue-700 p-4 rounded-lg font-bold text-lg">Pokémon</button>
                    <button class="bg-yellow-500 hover:bg-yellow-600 p-4 rounded-lg font-bold text-lg">Item</button>
                    <button class="bg-gray-600 hover:bg-gray-700 p-4 rounded-lg font-bold text-lg">Run</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Flowbite -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>

    <!-- Custom JS -->
    <script src="scripts/main.js" type="module"></script>
</body>
</html>
