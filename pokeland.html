<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fav Icon -->
    <link rel="icon" type="image/x-icon" href="images/Pokeball.png">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Animate.css -->
    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

    <title>Pokédex - Pokéland</title>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="dashboard-style.css">
    <link rel="stylesheet" href="style.css">    
</head>
<body id="pokeland">
    <header>
        <div class="wrapper">
            <!-- Nav Bar start -->
            <nav class="navbar">
                <div class="navbar-container">
                    <span class="toggler-icon">
                        <i class="fa-solid fa-circle-user"></i>
                        <span class="user-name"></span>
                    </span>
                    <div class="open" id="navbarNav">
                        <ul id="nav-links">
                            <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                            <li class="nav-item"><a class="nav-link" href="pokeland.html">Enter Pokéland</a></li>
                            <li class="nav-item"><a class="nav-link" href="#">Manage Account</a></li>
                            <li class="nav-item"><a class="nav-link" href="index.html">Log out <span><i class="fa-solid fa-right-from-bracket"></i></span></a></li>
                        </ul>
                    </div>
                </div>
            </nav>
            <!-- Nav Bar end --> 

            <!-- Welcome Section -->
            <section>
                <div class="container" id="welcome-section">
                    <h1><span class="pokedex-user"></span>, you are in Pokéland!</h1>
                    <h3>This is where you command all the Pokémon you caught. These are your options:</h3>
                </div>
            </section>
        </div>
    </header>
    <main>
        <div class="wrapper">
            <!-- Commands Section -->
            <section id="command-section">
                <div id="pokemon-command">
                    <div class="command">
                        <h4>Send Pokémon to Train</h4>
                        <img src="images/train.svg" alt="" height="50px">
                    </div>
                    <div class="command">
                        <h4>Battle</h4>
                        <img src="images/battle.svg" alt="" height="50px">
                    </div>
                    <div class="command">
                        <h4>Release Pokémon</h4>
                        <img src="images/phoenix.png" alt="" height="50px">
                    </div>
                    <div class="command">
                        <h4>Pokémon Stats</h4>
                        <img src="images/info.png" alt="" height="50px">
                    </div>
                </div>
            </section>

            <!-- Caught Pokémon Carousel -->
            <section>
                <div class="container">
                    <h3 class="pokemon-name">You have <span id="pokeCount">0</span> Pokémon</h3>

                    <div class="carousel-container">
                        <div class="nav-arrow left"><i class="fa-solid fa-circle-left"></i></div>
                        <div class="nav-arrow right"><i class="fa-solid fa-circle-right"></i></div>

                        <div id="cards-container"></div>
                    </div>
                </div>
            </section>
        </div>
    </main>
</body>
<!-- <script src="dashboard.js"></script> -->
<script src="script.js"></script>
</html>
